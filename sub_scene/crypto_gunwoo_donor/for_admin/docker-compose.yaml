x-uos-ctf:
  category: crypto

services:
  donor:
    build: .
    restart: unless-stopped
    ports:
      - "40577:31345"
    environment:
      FLAG: "${DONOR_FLAG:-SHA_local_development_flag}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',31345),2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
