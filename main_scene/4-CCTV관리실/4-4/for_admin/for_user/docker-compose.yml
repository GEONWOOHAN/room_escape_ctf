name: CCTV-4

x-uos-ctf:
  category: pwnable

services:
  archive-sweeper:
    build: .
    image: ${IMAGE_NAME:-archive-sweeper:local}
    platform: linux/amd64
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-40526}:31344"
    environment:
      TEAM_TOKENS_FILE: /run/secrets/archive_sweeper_tokens
    volumes:
      - "${TEAM_TOKENS_FILE:-./team_tokens.txt}:/run/secrets/archive_sweeper_tokens:ro"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    mem_limit: 128m
    stop_grace_period: 1s
